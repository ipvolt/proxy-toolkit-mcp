name: Publish reviewed npm release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Require the matching immutable version tag
        run: node scripts/check-release.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: IPVOLT_DEPLOY_NODE="$(command -v node)" python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - run: npm run check:content
      - run: npm run check:manifest
      - run: npm run check:package -- --output-dir .artifacts
      - name: Publish the verified tarball through npm OIDC
        run: npm publish .artifacts/*.tgz --access public --provenance
